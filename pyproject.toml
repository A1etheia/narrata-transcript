[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "narrata-transcript"
description = "Local pipeline that turns roleplay session recordings into structured transcripts for Narrata."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["pyyaml>=6", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
whisper = [
    "faster-whisper>=1.2.1,<1.3",
    "nvidia-cublas-cu12",
]
diarization = ["pyannote.audio>=4.0.7,<4.1"]

[project.scripts]
transcript = "transcript.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "transcript.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcript = ["contracts/*.json"]

[tool.ruff]
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
