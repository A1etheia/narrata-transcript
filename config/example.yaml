# Beispielkonfiguration. Kopieren nach config/config.yaml und dort anpassen.
# Keine Secrets in diese Datei: Die gehören in .env.

# Pflicht: Sprache der Aufnahmen als zweistelliger Code.
language: de

paths:
  # Pflicht: Wurzel für input/, work/ und output/.
  # Ein relativer Pfad gilt ab dem aktuellen Arbeitsverzeichnis.
  root: .

# Bleibt null: Das V0.1-Backend (Whisper large-v3-turbo) verarbeitet ganze Aufnahmen
# ohne eigene Segmentierung, siehe docs/spikes/TOOL-62-asr-vergleich.md.
# Werte braucht nur ein Backend, das in Blöcken arbeiten muss.
segmentation:
  length_seconds: null
  overlap_seconds: null

# Arbeitsformat der extrahierten Audiospur (immer WAV, 16 bit PCM).
audio:
  # Abtastrate in Hz; 16000 ist das, was Whisper und pyannote erwarten.
  sample_rate: 16000
  # 1 = mono, 2 = stereo.
  channels: 1

# Schreibt Transkripttext nach work/<gruppe>/<ordinal>/debug.log, nie auf die Konsole.
debug: false
