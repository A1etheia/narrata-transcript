# Beispielkonfiguration. Kopieren nach config/config.yaml und dort anpassen.
# Keine Secrets in diese Datei: Die gehören in .env.

# Pflicht: Sprache der Aufnahmen als zweistelliger Code.
language: de

paths:
  # Pflicht: Wurzel für input/, work/ und output/.
  # Ein relativer Pfad gilt ab dem aktuellen Arbeitsverzeichnis.
  root: .

# Bleibt null: Das V0.1-Backend (Whisper large-v3-turbo) verarbeitet ganze Aufnahmen
# ohne eigene Segmentierung, siehe docs/spikes/TOOL-62-asr-vergleich.md.
# Werte braucht nur ein Backend, das in Blöcken arbeiten muss.
segmentation:
  length_seconds: null
  overlap_seconds: null

# Arbeitsformat der extrahierten Audiospur (immer WAV, 16 bit PCM).
audio:
  # Abtastrate in Hz; 16000 ist das, was Whisper und pyannote erwarten.
  sample_rate: 16000
  # 1 = mono, 2 = stereo.
  channels: 1

# Spracherkennung: Whisper über faster-whisper, nur aus dem lokalen Modell-Cache.
# Einrichtung und Hardware siehe README, Abschnitt „Spracherkennung“.
asr:
  # Modellname von faster-whisper oder ein lokales Modellverzeichnis.
  model: large-v3-turbo
  # auto nimmt die NVIDIA-GPU, wenn eine erreichbar ist, sonst die CPU.
  device: auto
  # null: float16 auf der GPU, int8 auf der CPU.
  compute_type: null
  beam_size: 5
  # Weitere Versuche pro Segment nach Speichermangel oder Runtime-Fehler, 0 bis 5.
  retries: 2

# Sprecher-Diarisierung: pyannote, nur aus dem lokalen Modell-Cache.
# Einrichtung, einmaliger Download und Hardware siehe README, Abschnitt „Diarisierung“.
diarization:
  # Modellname auf Hugging Face oder ein lokales Modellverzeichnis.
  model: pyannote/speaker-diarization-community-1
  # auto nimmt die NVIDIA-GPU, wenn eine erreichbar ist, sonst die CPU.
  device: auto
  # Weitere Versuche pro Segment nach Speichermangel oder Runtime-Fehler, 0 bis 5.
  retries: 2

# Schreibt Transkripttext nach work/<gruppe>/<ordinal>/debug.log, nie auf die Konsole.
debug: false
