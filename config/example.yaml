# Beispielkonfiguration. Kopieren nach config/config.yaml und dort anpassen.
# Keine Secrets in diese Datei: Die gehören in .env.

# Pflicht: Sprache der Aufnahmen als zweistelliger Code.
language: de

paths:
  # Pflicht: Wurzel für input/, work/ und output/.
  # Ein relativer Pfad gilt ab dem aktuellen Arbeitsverzeichnis.
  root: .

# Bleibt null: Das V0.1-Backend (Whisper large-v3-turbo) verarbeitet ganze Aufnahmen
# ohne eigene Segmentierung, siehe docs/spikes/TOOL-62-asr-vergleich.md.
# Werte braucht nur ein Backend, das in Blöcken arbeiten muss.
segmentation:
  length_seconds: null
  overlap_seconds: null

# Arbeitsformat der extrahierten Audiospur (immer WAV, 16 bit PCM).
audio:
  # Abtastrate in Hz; 16000 ist das, was Whisper und pyannote erwarten.
  sample_rate: 16000
  # 1 = mono, 2 = stereo.
  channels: 1

# Spracherkennung: Whisper über faster-whisper, nur aus dem lokalen Modell-Cache.
# Einrichtung und Hardware siehe README, Abschnitt „Spracherkennung“.
asr:
  # Modellname von faster-whisper oder ein lokales Modellverzeichnis.
  model: large-v3-turbo
  # auto nimmt die NVIDIA-GPU, wenn eine erreichbar ist, sonst die CPU.
  device: auto
  # null: float16 auf der GPU, int8 auf der CPU.
  compute_type: null
  beam_size: 5
  # Weitere Versuche pro Segment nach Speichermangel oder Runtime-Fehler, 0 bis 5.
  retries: 2

# Sprecher-Diarisierung: pyannote, nur aus dem lokalen Modell-Cache.
# Einrichtung, einmaliger Download und Hardware siehe README, Abschnitt „Diarisierung“.
diarization:
  # Modellname auf Hugging Face oder ein lokales Modellverzeichnis.
  model: pyannote/speaker-diarization-community-1
  # auto nimmt die NVIDIA-GPU, wenn eine erreichbar ist, sonst die CPU.
  device: auto
  # Weitere Versuche pro Segment nach Speichermangel oder Runtime-Fehler, 0 bis 5.
  retries: 2

# Abruf des Transkriptionskontexts aus Narrata (transcript context).
# Der Token gehört nicht hierher, sondern als NARRATA_TOKEN in .env.
narrata:
  # Basis-URL des Narrata-Hosts; https, http nur für localhost.
  url: null
  # Gruppen-ID je Gruppen-Slug aus dem Session-Schlüssel, etwa beispielgruppe: 12.
  groups: {}
  # Stufe recent: Einträge aus den letzten n Sitzungen, diese eingeschlossen, 1 bis 20.
  recent_sessions: 3
  # Höchstzahl der Glossar-Einträge der Stufe archive, 0 bis 2000.
  archive_limit: 500

# Wissens-Snapshot (transcript snapshot).
knowledge:
  # Höchstzahl der Glossar-Einträge je Typ aus den Stufen session und recent, die
  # ASR-Keyword-Kandidaten werden. Spielfiguren sind immer dabei und zählen nicht mit.
  # Ein fehlender Typ behält seinen Default, 0 heißt keiner.
  keyword_budget:
    person: 15
    place: 10
    organisation: 5
    artifact: 5
    event: 3
    lore: 3

# Review-Signale nach der ASR. Startwerte, kalibriert in TOOL-35; ein fehlender
# Schlüssel behält seinen Default.
review:
  # Wann ein erkanntes Wort einem Glossarbegriff ähnlich ist (Hinweis similar).
  similar:
    # Mindestähnlichkeit der Schreibung, 0 bis 1.
    min_ratio: 0.85
    # Mindestlänge von Begriff und erkanntem Wort in Buchstaben.
    min_length: 4
    # Höchste Längenabweichung als Anteil der Begriffslänge, 0 bis 0.9.
    max_length_deviation: 0.3
  # Regeln der Unsicherheitsbewertung pro Passage: confident, needs_review, uncertain.
  uncertainty:
    # Ein Wort unter word_low gilt als unsicher; eines unter word_very_low macht die
    # Passage mindestens needs_review.
    word_low: 0.5
    word_very_low: 0.2
    # Anteil unsicherer Wörter einer Passage für needs_review bzw. uncertain.
    low_share_review: 0.2
    low_share_uncertain: 0.5
    # Segmentsignale von Whisper: ab no_speech_prob, bis avg_logprob, ab compression_ratio.
    no_speech_prob: 0.6
    avg_logprob: -1.0
    compression_ratio: 2.4
    # Hinweise auf ausgelassene Wörter: längste Pause zwischen zwei Wörtern in ms
    # und Mindestzahl Wörter pro Sekunde.
    gap_ms: 2500
    min_words_per_second: 1.0
    # Mindestdauer in ms, ab der Übersprechen in einer Passage zählt; kürzeres ist
    # bei einer Runde am Tisch der Normalfall.
    crosstalk_ms: 1000
    # Stufe, auf die ein Hinweis similar die Passage hebt; confident heißt keine.
    similar_level: needs_review
    # Dasselbe für similar-Hinweise, die nur über den Klang gefunden wurden. Sie
    # bleiben in der Hinweisdatei sichtbar, heben die Passage aber nicht an.
    similar_sound_level: confident

# Schreibt Transkripttext nach work/<gruppe>/<ordinal>/debug.log, nie auf die Konsole.
debug: false
